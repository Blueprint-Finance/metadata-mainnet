name: Validate Pull Request

# SECURITY: this workflow validates files that an untrusted fork can propose, so
# it must never execute code from the PR branch while holding a write-scoped
# token. `pull_request_target` runs in the BASE repository context with a
# read/write GITHUB_TOKEN and access to secrets; checking out and building the
# PR head under it is the classic pwn-request pattern (a forked PR could run
# arbitrary code and use the token to push to main or read secrets).
#
# `pull_request` instead runs in a context whose token is read-only for forks
# and has no access to repository secrets, so even if PR code were executed it
# could not escalate. Note that `pull_request` does NOT fire for PRs whose head
# SHA is unchanged, which is acceptable here: the validator is a best-effort
# check, and the fork branch is still fetched below via the explicit `ref`.
on:
  pull_request:
    branches:
      - main

jobs:
  validate-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      # Read-only for contents. The PR comment is posted from this token, so
      # pull-requests: write is still required for the status check; nothing
      # here needs to modify repository contents.
      contents: read
      pull-requests: write

    steps:
      - name: Detect changed files
        uses: yumemi-inc/changed-files@50f2544ad88b4f274eace9689431b7281132304c  # pin@v3.2.0
        id: changes
        with:
          exclude-statuses: 'removed'

      # The PR head is checked out purely as inert DATA for the validator to
      # read. It is never executed: the Validate step below runs a pinned
      # third-party action, and the untrusted tree is confined to `pr/`.
      - name: Checkout repository (PR head, untrusted data)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # pin@v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          path: pr

      - name: Checkout upstream
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # pin@v6.0.1
        with:
          path: upstream
          ref: main
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          persist-credentials: false

      # Pinned to the exact commit currently referenced by upstream's `main`
      # (verified 2026-09-30). See full-info.yml for the rationale.
      - name: Validate
        if: steps.changes.outputs.exists == 'true'
        uses: symbioticfi/metadata-validation-scripts@a21a6f01a2b6c5fda769e0c7c0b55d79172568f6
        with:
          files: ${{ steps.changes.outputs.files }}
          issue: ${{ github.event.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          chain-id: 1
          upstream-checkout-path: upstream
          network-registry: "0xc773b1011461e7314cf05f97d95aa8e92c1fd8aa"
          operator-registry: "0xad817a6bc954f678451a71363f04150fdd81af9f"
          vault-registry: "0xaeb6bdd95c502390db8f52c8909f703e9af6a346"
