name: Validate Pull Request

# SECURITY & DESIGN NOTES:
# 1. Why `pull_request_target` is required:
#    Metadata validation scripts must post feedback comments/reviews to the PR.
#    Standard `pull_request` forces a read-only GITHUB_TOKEN on fork-based PRs,
#    causing GitHub API 403 Forbidden errors when attempting to post comments.
#
# 2. Why this `pull_request_target` usage is safe against "pwn-request":
#    - Zero Code Execution: This repository hosts inert metadata (JSON). No build
#      scripts, npm/make tasks, or repo binaries are ever executed from the PR.
#    - Immutable Action Pinning: All third-party actions are pinned to full commit SHAs.
#    - Least Privilege: Job permissions are restricted to `contents: read` and
#      `pull-requests: write`.
#    - Credential Hygiene: `persist-credentials: false` is strictly enforced.
#    - Root Checkout: The PR head is checked out at workspace root (`.`) so
#      `changed-files` and `metadata-validation-scripts` locate relative paths correctly.
on:
  pull_request_target:
    branches:
      - main

jobs:
  validate-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Detect changed files
        uses: yumemi-inc/changed-files@50f2544ad88b4f274eace9689431b7281132304c  # pin@v3.2.0
        id: changes
        with:
          exclude-statuses: 'removed'

      # Check out the PR head at root so paths output by changed-files match disk locations.
      - name: Checkout PR head (metadata validation target)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # pin@v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Checkout upstream
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # pin@v6.0.1
        with:
          path: upstream
          ref: main
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          persist-credentials: false

      # Pinned to the exact commit currently referenced by upstream's `main`
      - name: Validate
        if: steps.changes.outputs.exists == 'true'
        uses: symbioticfi/metadata-validation-scripts@a21a6f01a2b6c5fda769e0c7c0b55d79172568f6
        with:
          files: ${{ steps.changes.outputs.files }}
          issue: ${{ github.event.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          chain-id: 1
          upstream-checkout-path: upstream
          network-registry: "0xc773b1011461e7314cf05f97d95aa8e92c1fd8aa"
          operator-registry: "0xad817a6bc954f678451a71363f04150fdd81af9f"
          vault-registry: "0xaeb6bdd95c502390db8f52c8909f703e9af6a346"
